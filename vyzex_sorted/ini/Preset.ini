[Stringlist 2]
size=5
100=FIRMWARE UPGRADE PROCEDURE
101=To upgrade your MPK88/61 firmware, proceed by clicking on the Continue button.
102=Follow the instructions in each dialog, continuing when you have completed each step.
103=At the end of the upgrade this program will exit. Please re-launch the editor once MPK88/61 has been restarted. 
104=Continue
105=Cancel

[Stringlist 3]
size=5
100=FIRMWARE UPGRADE PROCEDURE - STEP 1
101=WARNING: Only proceed if you have a firmware .SYX file to download!  
102=Please unplug your MPK88/61's USB cable now. Next, hold down the '<<', 'Stop' and 'Rec' buttons of MPK88/61's transport bar and plug the USB cable back in. When MPK88/61 displays 'Upgrade ERASE OK?' Press MPK88/61's ENTER button.
103=Once 'SEND SYSEX' is displayed in MPK88/61's LCD Display, you may continue.
104=Continue to select the MPK88/61 MIDI output port.
105=Cancel

[Stringlist 4]
size=5
100=FIRMWARE UPGRADE PROCEDURE - STEP 2
101=Vyzex MPK88/61 will now prompt you to choose the firmware update SYX file. It will be sent immediately.  
102=When completed, Vyzex MPK88/61 will shut down and MPK88/61's LCD will display 'DONE PRESS ENTER'. 
103=Press MPK88/61's ENTER button and relaunch the editor to resume operation.
104=Select file, send, then close.
105=Cancel


[Stringlist 5]
size=5
